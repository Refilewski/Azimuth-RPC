name: Apply FH2ML Host API refactor

on:
  push:
    branches:
      - feat/fh2ml-host-api
    paths:
      - .github/workflows/apply-fh2ml-host-api.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/fh2ml-host-api
          fetch-depth: 0

      - name: Apply deterministic refactor
        shell: pwsh
        run: ./scripts/apply-fh2ml-host-api-refactor.ps1

      - name: Correct generated contract marker
        shell: pwsh
        run: |
          $path = 'tests/native-fh2ml-api-contract.ps1'
          $text = Get-Content $path -Raw
          $text = $text.Replace('api->GetGameModule()', 'g_hostApi->GetGameModule()')
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Verify generated contract
        shell: pwsh
        run: ./tests/native-fh2ml-api-contract.ps1

      - name: Commit refactor
        shell: pwsh
        run: |
          git restore --source=HEAD -- .github/workflows/build-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add -A
          git commit -m "feat: integrate native mod with FH2ML host API"
          git push origin HEAD:feat/fh2ml-host-api
